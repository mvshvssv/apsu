name: "Feature Request"
description: Create a new ticket for a new feature request
title: "feat: <title>"
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Provide a general summary of the issue in the Title above
  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: Tell us how it should work
      placeholder: Short and explicit description of your request...
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: "Current Behavior"
      description: Explain the difference from current behavior
    validations:
      required: false
  - type: checkboxes
    id: affected-packages
    attributes:
      label: "Affected packages"
      options:
        - label: cli
        - label: core
        - label: prompt
        - label: config-angular
  - type: input
    id: parent
    attributes:
      label: "Parent"
      description: Reference to a parent issue (if any).
      placeholder: "#123"
    validations:
      required: false
  - type: textarea
    id: what-to-build
    attributes:
      label: "What to Build"
      description: Concise description of this vertical slice end-to-end. Describe behavior, not layer-by-layer implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance Criteria"
      value: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: input
    id: blocked-by
    attributes:
      label: "Blocked by"
      placeholder: "#456 or None — can start immediately"
    validations:
      required: false
  - type: textarea
    id: possible-solution
    attributes:
      label: "Possible Solution"
      description: Ideas how to implement the addition or change
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: |
        How has this issue affected you? What are you trying to accomplish?
        Providing context helps us come up with a solution that is most useful in the real world
    validations:
      required: false
